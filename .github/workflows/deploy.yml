name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm ci

      - name: Chạy kiểm thử tự động
        run: npm run test

      - name: Kiểm tra quy chuẩn giao diện (Mục 10)
        run: npm run lint:ui

      - name: Đóng gói ứng dụng (Build)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Tải lên artifact cho GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
